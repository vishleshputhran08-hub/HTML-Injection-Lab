<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HTML Injection Lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1><a href="{{ url_for('index') }}">HTML Injection Lab</a></h1>
      <nav>
        {% if session.get('authenticated') %}
          <a href="{{ url_for('portal') }}">Portal</a>
          <span class="nav-user">Logged in as {{ session.get('username') }}</span>
          <a href="{{ url_for('logout') }}">Logout</a>
        {% else %}
          <a href="{{ url_for('login') }}">Login</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="wrap site-footer">
    Intentionally vulnerable training application. Keep it bound to localhost.
  </footer>
</body>
</html>
